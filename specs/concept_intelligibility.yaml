concept_id: GMRTI-INTELLIGIBILITY
name: "Minimal Intelligibility Bootstrap"
intent: >-
  To establish a stratified decoding substrate that guarantees basic decoding
  under zero-charity conditions while enabling GMRTI-mediated repair.
dependencies:
  - GMRTI-COVENANT
invariants:
  - >-
      Stratifies the substrate into a framework-independent Minimal Substrate
      and a GMRTI-specific Primitive Covenant.
  - >-
      Calibrates zero-charity interpretation to the Minimal Substrate baseline
      to guarantee basic signal decoding.
  - "Requires the Primitive Covenant for GMRTI-mediated targeted repair."
status: STABLE
