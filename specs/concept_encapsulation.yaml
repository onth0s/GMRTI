concept_id: GMRTI-ENCAPSULATION
name: "Boundary-Tracing Encapsulation"
intent: >-
  To attenuate local semantic modifications' holistic propagation across
  the entire network by drawing formal boundaries around subgraphs.
dependencies:
  - GMRTI-TOPOLOGY
invariants:
  - "Local repairs must be enclosed in a boundary-covenant wrapper."
  - "Treats encapsulated subgraphs as black-box nodes with declared interfaces."
  - "Attenuates edge-change propagation beyond the immediate concept region."
open_issues:
  - "Holistic leakage: outer context shifts propagate via interface edges."
status: STABLE
