concept_id: GMRTI-ENTROPY
name: "Semantic Entropy"
intent: >-
  To measure structural ambiguity in a transmitted signal as the count of non-
  isomorphic receiving-covenant configurations compatible with it.
dependencies:
  - GMRTI-COVENANT
  - GMRTI-OPERATIONAL-ACTION-THRESHOLD
invariants:
  - >-
      Measured quantitatively using the Behavioral Convergence Proxy (Path-Count
      metric).
  - >-
      Graph-Space Partitioning Axiom: candidate topologies are individuated as
      quotient equivalence classes under functional congruence across the
      Operational Action Threshold (§8b.1).
  - >-
      Perfect entropy elimination (zero entropy) is structurally impossible
      under metaagnosticism.
  - "Targeted reduction prioritizes high-DRC structural/axiomatic subgraphs."
status: STABLE
last_modified: "2026-09-18"
