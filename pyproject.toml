[project]
name = "gmrti"
version = "0.9.0"
description = "General Method for Refinement and Transmission of Ideas"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8.0", "playwright>=1.40"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "repo_state: tests that assert against live repository working-tree files",
]
